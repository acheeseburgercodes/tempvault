name: Sign release with SignPath

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing TempVault release tag to rebuild and sign
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  sign:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify immutable release tag
        shell: pwsh
        run: |
          git fetch origin tag "${{ inputs.release_tag }}" --force
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$packageVersion" -ne "${{ inputs.release_tag }}") {
            throw "Release tag does not match package version"
          }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install and verify
        run: |
          npm ci
          npm run verify
          npm run package

      - name: Create signing input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path signpath-input | Out-Null
          Copy-Item release/TempVault-Setup-*-x64.exe signpath-input/
          Copy-Item release/TempVault-Portable-*-x64.exe signpath-input/

      - name: Upload unsigned signing input
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tempvault-${{ inputs.release_tag }}-signing-input
          if-no-files-found: error
          retention-days: 30
          path: signpath-input/*.exe

      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath-signed

      - name: Publish signed binaries to existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $signedFiles = Get-ChildItem signpath-signed -Recurse -Filter *.exe
          if ($signedFiles.Count -ne 2) {
            throw "Expected exactly two signed TempVault executables; found $($signedFiles.Count)"
          }
          $signedFiles | ForEach-Object {
            gh release upload "${{ inputs.release_tag }}" $_.FullName --clobber --repo "${{ github.repository }}"
          }

      - name: Retain signed build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tempvault-${{ inputs.release_tag }}-signed
          if-no-files-found: error
          retention-days: 90
          path: signpath-signed/**
